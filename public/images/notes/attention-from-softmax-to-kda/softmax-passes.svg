<svg xmlns="http://www.w3.org/2000/svg" width="820" height="748" viewBox="0 0 820 748" role="img"><title>safe softmax: max → sum exp → normalize</title><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="410.0" y="37" font-size="22" text-anchor="middle" fill="#26313b">safe softmax: max → sum exp → normalize</text><text x="410.0" y="92" font-size="17" text-anchor="middle" fill="#64707b">Pass 1：读取整行，得到最大值 m=2</text><rect x="229.0" y="123.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="241.5" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="256.0" y="123.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="268.5" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">1</text><rect x="283.0" y="123.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="295.5" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">2</text><path d="M 224.0 122.0 h -4 v 27 h 4 M 313.0 122.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="268.5" y="176" font-size="18" text-anchor="middle" fill="#26313b">x</text><text x="268.5" y="201" font-size="15" text-anchor="middle" fill="#64707b">1 × M</text><text x="410.0" y="142.5" font-size="22" text-anchor="middle" fill="#26313b">max →</text><rect x="539.0" y="123.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="551.5" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">2</text><path d="M 534.0 122.0 h -4 v 27 h 4 M 569.0 122.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="551.5" y="176" font-size="18" text-anchor="middle" fill="#26313b">m</text><text x="551.5" y="201" font-size="15" text-anchor="middle" fill="#64707b">1 × 1</text><text x="410.0" y="252" font-size="17" text-anchor="middle" fill="#64707b">Pass 2：再次读取 x，以同一 m 计算指数和 l</text><rect x="229.0" y="283.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="241.5" y="300.0" font-size="13" text-anchor="middle" fill="#26313b">.14</text><rect x="256.0" y="283.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="268.5" y="300.0" font-size="13" text-anchor="middle" fill="#26313b">.37</text><rect x="283.0" y="283.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="295.5" y="300.0" font-size="13" text-anchor="middle" fill="#26313b">1</text><path d="M 224.0 282.0 h -4 v 27 h 4 M 313.0 282.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="268.5" y="336" font-size="18" text-anchor="middle" fill="#26313b">exp(x−m)</text><text x="268.5" y="361" font-size="15" text-anchor="middle" fill="#64707b">1 × M</text><text x="410.0" y="302.5" font-size="22" text-anchor="middle" fill="#26313b">sum →</text><rect x="539.0" y="283.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="551.5" y="300.0" font-size="13" text-anchor="middle" fill="#26313b">1.5</text><path d="M 534.0 282.0 h -4 v 27 h 4 M 569.0 282.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="551.5" y="336" font-size="18" text-anchor="middle" fill="#26313b">l</text><text x="551.5" y="361" font-size="15" text-anchor="middle" fill="#64707b">1 × 1</text><text x="410.0" y="412" font-size="17" text-anchor="middle" fill="#64707b">Pass 3：再次读取 x，重新计算指数并除以 l</text><rect x="229.0" y="443.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="256.0" y="443.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="283.0" y="443.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><path d="M 224.0 442.0 h -4 v 27 h 4 M 313.0 442.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="268.5" y="496" font-size="18" text-anchor="middle" fill="#26313b">exp(x−m)</text><text x="268.5" y="521" font-size="15" text-anchor="middle" fill="#64707b">1 × M</text><text x="410.0" y="462.5" font-size="22" text-anchor="middle" fill="#26313b">÷ l →</text><rect x="512.0" y="443.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="524.5" y="460.0" font-size="13" text-anchor="middle" fill="#26313b">.09</text><rect x="539.0" y="443.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="551.5" y="460.0" font-size="13" text-anchor="middle" fill="#26313b">.24</text><rect x="566.0" y="443.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="578.5" y="460.0" font-size="13" text-anchor="middle" fill="#26313b">.67</text><path d="M 507.0 442.0 h -4 v 27 h 4 M 596.0 442.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="551.5" y="496" font-size="18" text-anchor="middle" fill="#26313b">P</text><text x="551.5" y="521" font-size="15" text-anchor="middle" fill="#64707b">1 × M</text><rect x="24" y="572" width="772" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="600" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="600" font-size="16" text-anchor="start" fill="#26313b">一行 M 个分数；图中文字为四舍五入示意，正文有精确值。</text><text x="43" y="634" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="634" font-size="16" text-anchor="start" fill="#26313b">m 是最大值，l 是缩放后的指数和；都只占一个标量。</text><text x="43" y="668" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="668" font-size="16" text-anchor="start" fill="#26313b">这里不缓存指数数组：3 次读 x + 1 次写 P；pass 不等于 kernel。</text><text x="410.0" y="723" font-size="13" text-anchor="middle" fill="#7a8288">softmax-passes@五道口纳什</text></g></svg>