ont-size="18" text-anchor="middle" fill="#26313b">F 或 E（mask前）</text><text x="656.0" y="255" font-size="15" text-anchor="middle" fill="#64707b">C × C</text><rect x="24" y="306" width="772" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="334" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="334" font-size="16" text-anchor="start" fill="#26313b">G[i]=α1⊙…⊙αi；逐元素乘除发生在同形 C × dk 数组上。</text><text x="43" y="368" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="368" font-size="16" text-anchor="start" fill="#26313b">F 截成严格下三角，E 截成含对角的下三角。</text><text x="43" y="402" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="402" font-size="16" text-anchor="start" fill="#26313b">第 i,j 项的门比值为 Gi/Gj；只适用于 G 非零且数值安全。</text><text x="410.0" y="457" font-size="13" text-anchor="middle" fill="#7a8288">chunk-gram@五道口纳什</text></g></svg>