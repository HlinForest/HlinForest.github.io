" text-anchor="start" fill="#26313b">机制</text><text x="101" y="429" font-size="16" text-anchor="start" fill="#26313b">一个 query 行与每一个 key 列做点积；结果再逐元素缩放。</text><text x="410.0" y="484" font-size="13" text-anchor="middle" fill="#7a8288">scores@五道口纳什</text></g></svg>