<svg xmlns="http://www.w3.org/2000/svg" width="820" height="455" viewBox="0 0 820 455" role="img"><title>[x′, y′] = [x, y] Rθ ; RθRθᵀ = I</title><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="410.0" y="37" font-size="22" text-anchor="middle" fill="#26313b">[x′, y′] = [x, y] Rθ ; RθRθᵀ = I</text><text x="410.0" y="92" font-size="17" text-anchor="middle" fill="#64707b">每两个坐标旋转；不同坐标对使用不同频率</text><rect x="138.0" y="136.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="150.5" y="153.5" font-size="13" text-anchor="middle" fill="#26313b">x</text><rect x="165.0" y="136.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="177.5" y="153.5" font-size="13" text-anchor="middle" fill="#26313b">y</text><path d="M 133.0 135.5 h -4 v 27 h 4 M 195.0 135.5 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="164.0" y="203" font-size="18" text-anchor="middle" fill="#26313b">坐标对</text><text x="164.0" y="228" font-size="15" text-anchor="middle" fill="#64707b">1 × 2</text><text x="287.0" y="156.0" font-size="22" text-anchor="middle" fill="#26313b">×</text><rect x="384.0" y="123.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="396.5" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">cos</text><rect x="411.0" y="123.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="423.5" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">sin</text><rect x="384.0" y="150.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="396.5" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">−sin</text><rect x="411.0" y="150.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="423.5" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">cos</text><path d="M 379.0 122.0 h -4 v 54 h 4 M 441.0 122.0 h 4 v 54 h -4" fill="none" stroke="#626970"/><text x="410.0" y="203" font-size="18" text-anchor="middle" fill="#26313b">Rθ</text><text x="410.0" y="228" font-size="15" text-anchor="middle" fill="#64707b">2 × 2</text><text x="533.0" y="156.0" font-size="22" text-anchor="middle" fill="#26313b">=</text><rect x="630.0" y="136.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="642.5" y="153.5" font-size="13" text-anchor="middle" fill="#26313b">x′</text><rect x="657.0" y="136.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="669.5" y="153.5" font-size="13" text-anchor="middle" fill="#26313b">y′</text><path d="M 625.0 135.5 h -4 v 27 h 4 M 687.0 135.5 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="656.0" y="203" font-size="18" text-anchor="middle" fill="#26313b">旋转后</text><text x="656.0" y="228" font-size="15" text-anchor="middle" fill="#64707b">1 × 2</text><rect x="24" y="279" width="772" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="307" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="307" font-size="16" text-anchor="start" fill="#26313b">θ=position×frequency；行向量约定为右乘 Rθ。</text><text x="43" y="341" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="341" font-size="16" text-anchor="start" fill="#26313b">Rθ 是旋转矩阵，不是概率；两个转置位置必须一致。</text><text x="43" y="375" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="375" font-size="16" text-anchor="start" fill="#26313b">query 与 key 各用自身位置，点积由相对位置差控制。</text><text x="410.0" y="430" font-size="13" text-anchor="middle" fill="#7a8288">rope-pairs@五道口纳什</text></g></svg>