<svg xmlns="http://www.w3.org/2000/svg" width="820" height="642" viewBox="0 0 820 642" role="img"><title>mask → row softmax → training dropout → PV</title><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="410.0" y="37" font-size="22" text-anchor="middle" fill="#26313b">mask → row softmax → training dropout → PV</text><text x="410.0" y="92" font-size="17" text-anchor="middle" fill="#64707b">mask 的 False 是禁止访问；第 3 行是无效 query</text><rect x="247.5" y="123.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="260.0" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">1</text><rect x="274.5" y="123.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="287.0" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="301.5" y="123.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="314.0" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="247.5" y="150.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="260.0" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">1</text><rect x="274.5" y="150.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="287.0" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">1</text><rect x="301.5" y="150.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="314.0" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="247.5" y="177.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="260.0" y="194.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="274.5" y="177.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="287.0" y="194.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="301.5" y="177.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="314.0" y="194.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><path d="M 242.5 122.0 h -4 v 81 h 4 M 331.5 122.0 h 4 v 81 h -4" fill="none" stroke="#626970"/><text x="287.0" y="230" font-size="18" text-anchor="middle" fill="#26313b">keep: 1=True</text><text x="287.0" y="255" font-size="15" text-anchor="middle" fill="#64707b">N × M</text><text x="410.0" y="169.5" font-size="22" text-anchor="middle" fill="#26313b">→</text><rect x="493.5" y="123.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="506.0" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">1</text><rect x="520.5" y="123.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="533.0" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="547.5" y="123.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="560.0" y="140.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="493.5" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="506.0" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">.25</text><rect x="520.5" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="533.0" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">.75</text><rect x="547.5" y="150.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="560.0" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="493.5" y="177.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="506.0" y="194.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="520.5" y="177.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="533.0" y="194.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="547.5" y="177.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="560.0" y="194.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><path d="M 488.5 122.0 h -4 v 81 h 4 M 577.5 122.0 h 4 v 81 h -4" fill="none" stroke="#626970"/><text x="533.0" y="230" font-size="18" text-anchor="middle" fill="#26313b">P</text><text x="533.0" y="255" font-size="15" text-anchor="middle" fill="#64707b">N × M</text><text x="410.0" y="306" font-size="17" text-anchor="middle" fill="#64707b">dropout 示例：p_drop=0.5，保留的权重乘 2</text><rect x="138.0" y="337.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="150.5" y="354.0" font-size="13" text-anchor="middle" fill="#26313b">.25</text><rect x="165.0" y="337.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="177.5" y="354.0" font-size="13" text-anchor="middle" fill="#26313b">.75</text><path d="M 133.0 336.0 h -4 v 27 h 4 M 195.0 336.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="164.0" y="390" font-size="18" text-anchor="middle" fill="#26313b">P 行</text><text x="164.0" y="415" font-size="15" text-anchor="middle" fill="#64707b">1 × 2</text><text x="287.0" y="356.5" font-size="22" text-anchor="middle" fill="#26313b">⊙</text><rect x="384.0" y="337.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="396.5" y="354.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="411.0" y="337.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="423.5" y="354.0" font-size="13" text-anchor="middle" fill="#26313b">2</text><path d="M 379.0 336.0 h -4 v 27 h 4 M 441.0 336.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="410.0" y="390" font-size="18" text-anchor="middle" fill="#26313b">随机保留 / 0.5</text><text x="410.0" y="415" font-size="15" text-anchor="middle" fill="#64707b">1 × 2</text><text x="533.0" y="356.5" font-size="22" text-anchor="middle" fill="#26313b">=</text><rect x="630.0" y="337.0" width="25" height="25" rx="1.5" fill="#ffffff" fill-opacity="1" stroke="#d7dadd" stroke-width=".5"/><text x="642.5" y="354.0" font-size="13" text-anchor="middle" fill="#26313b">0</text><rect x="657.0" y="337.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="669.5" y="354.0" font-size="13" text-anchor="middle" fill="#26313b">1.5</text><path d="M 625.0 336.0 h -4 v 27 h 4 M 687.0 336.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="656.0" y="390" font-size="18" text-anchor="middle" fill="#26313b">P̃ 行</text><text x="656.0" y="415" font-size="15" text-anchor="middle" fill="#64707b">1 × 2</text><rect x="24" y="466" width="772" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="494" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="494" font-size="16" text-anchor="start" fill="#26313b">行是 query，列是 key；mask 广播到独立的 batch/head。</text><text x="43" y="528" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="528" font-size="16" text-anchor="start" fill="#26313b">全遮蔽行返回全 0 是本文约定；dropout 后一行不必和为 1。</text><text x="43" y="562" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="562" font-size="16" text-anchor="start" fill="#26313b">mask 决定可见性；dropout 对已有概率随机置零，再按保留率缩放。</text><text x="410.0" y="617" font-size="13" text-anchor="middle" fill="#7a8288">mask-dropout@五道口纳什</text></g></svg>