 font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="555" font-size="16" text-anchor="start" fill="#26313b">合并矩阵可能更大，是否预存要权衡参数存储与执行成本。</text><text x="43" y="589" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="589" font-size="16" text-anchor="start" fill="#26313b">图中没有跨过 softmax 或 RMSNorm；只能重排相邻线性运算。</text><text x="410.0" y="644" font-size="13" text-anchor="middle" fill="#7a8288">mla-output@五道口纳什</text></g></svg>