#26313b">=</text><rect x="692.0" y="136.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="719.0" y="136.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><path d="M 687.0 135.5 h -4 v 27 h 4 M 749.0 135.5 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="718.0" y="203" font-size="18" text-anchor="middle" fill="#26313b">qC Rt</text><text x="718.0" y="228" font-size="15" text-anchor="middle" fill="#64707b">1 × dc</text><text x="472.0" y="279" font-size="17" text-anchor="middle" fill="#64707b">历史位置 s 的旋转插在 query 与升维矩阵之间</text><rect x="77.0" y="323.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="104.0" y="323.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><path d="M 72.0 322.5 h -4 v 27 h 4 M 134.0 322.5 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="103.0" y="390" font-size="18" text-anchor="middle" fill="#26313b">qC Rt</text><text x="103.0" y="415" font-size="15" text-anchor="middle" fill="#64707b">1 × dc</text><text x="226.0" y="343.0" font-size="22" text-anchor="middle" fill="#26313b">×</text><rect x="323.0" y="310.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="350.0" y="310.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="323.0" y="337.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="350.0" y="337.0" width="25" height="25" rx="1.5" fill="#85898F" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><path d="M 318.0 309.0 h -4 v 54 h 4 M 380.0 309.0 h 4 v 54 h -4" fill="none" stroke="#626970"/><text x="349.0" y="390" font-size="18" text-anchor="middle" fill="#26313b">Rsᵀ</text><text x="349.0" y="415" font-size="15" text-anchor="middle" fill="#64707b">dc × dc</text><text x="472.0" y="343.0" font-size="22" text-anchor="middle" fill="#26313b">×</text><rect x="555.5" y="310.0" width="25" height="25" rx="1.5" fill="#EE995B" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="582.5" y="310.0" width="25" height="25" rx="1.5" fill="#EE995B" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="609.5" y="310.0" width="25" height="25" rx="1.5" fill="#EE995B" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="555.5" y="337.0" width="25" height="25" rx="1.5" fill="#EE995B" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="582.5" y="337.0" width="25" height="25" rx="1.5" fill="#EE995B" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="609.5" y="337.0" width="25" height="25" rx="1.5" fill="#EE995B" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><path d="M 550.5 309.0 h -4 v 54 h 4 M 639.5 309.0 h 4 v 54 h -4" fill="none" stroke="#626970"/><text x="595.0" y="390" font-size="18" text-anchor="middle" fill="#26313b">UKᵀ</text><text x="595.0" y="415" font-size="15" text-anchor="middle" fill="#64707b">dc × r</text><text x="718.0" y="343.0" font-size="22" text-anchor="middle" fill="#26313b">=</text><rect x="801.5" y="323.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="828.5" y="323.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="855.5" y="323.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><path d="M 796.5 322.5 h -4 v 27 h 4 M 885.5 322.5 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="841.0" y="390" font-size="18" text-anchor="middle" fill="#26313b">依赖 s 的 query</text><text x="841.0" y="415" font-size="15" text-anchor="middle" fill="#64707b">1 × r</text><rect x="24" y="466" width="896" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="494" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="494" font-size="16" text-anchor="start" fill="#26313b">dc=2，r=3；Rs 随每个历史 token 改变，Rt 由当前 query 位置决定。</text><text x="43" y="528" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="528" font-size="16" text-anchor="start" fill="#26313b">旋转矩阵与一般投影矩阵不可交换；改变括号不会改变这个次序。</text><text x="43" y="562" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="562" font-size="16" text-anchor="start" fill="#26313b">最后再乘 csᵀ 才得到一个分数；无法对所有 s 只做一次 query 变换。</text><text x="472.0" y="617" font-size="13" text-anchor="middle" fill="#7a8288">rope-obstruction@五道口纳什</text></g></svg>