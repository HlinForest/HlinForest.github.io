" text-anchor="start" fill="#26313b">Ac 是非负核相似度；白格严格为 0，不可含未来 token。</text><text x="43" y="830" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="830" font-size="16" text-anchor="start" fill="#26313b">总分母=Q̄c zbefore+rowsum(Ac)；先合分子分母，再做一次除法。</text><text x="472.0" y="885" font-size="13" text-anchor="middle" fill="#7a8288">linear-chunk@五道口纳什</text></g></svg>