" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="643.5" y="591.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="670.5" y="591.5" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><path d="M 611.5 590.5 h -4 v 27 h 4 M 700.5 590.5 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="656.0" y="658" font-size="18" text-anchor="middle" fill="#26313b">content logits</text><text x="656.0" y="683" font-size="15" text-anchor="middle" fill="#64707b">1 × k</text><text x="410.0" y="734" font-size="17" text-anchor="middle" fill="#64707b">加位置分数，做主 softmax 后再聚合</text><rect x="124.5" y="792.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="151.5" y="792.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="178.5" y="792.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><path d="M 119.5 791.0 h -4 v 27 h 4 M 208.5 791.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="164.0" y="872" font-size="18" text-anchor="middle" fill="#26313b">ph,sel</text><text x="164.0" y="897" font-size="15" text-anchor="middle" fill="#64707b">1 × k</text><text x="287.0" y="811.5" font-size="22" text-anchor="middle" fill="#26313b">×</text><rect x="384.0" y="765.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="411.0" y="765.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="384.0" y="792.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="411.0" y="792.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="384.0" y="819.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="411.0" y="819.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><path d="M 379.0 764.0 h -4 v 81 h 4 M 441.0 764.0 h 4 v 81 h -4" fill="none" stroke="#626970"/><text x="410.0" y="872" font-size="18" text-anchor="middle" fill="#26313b">Csel</text><text x="410.0" y="897" font-size="15" text-anchor="middle" fill="#64707b">k × r</text><text x="533.0" y="811.5" font-size="22" text-anchor="middle" fill="#26313b">=</text><rect x="630.0" y="792.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="657.0" y="792.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><path d="M 625.0 791.0 h -4 v 27 h 4 M 687.0 791.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="656.0" y="872" font-size="18" text-anchor="middle" fill="#26313b">zh</text><text x="656.0" y="897" font-size="15" text-anchor="middle" fill="#64707b">1 × r</text><rect x="24" y="948" width="772" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="976" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="976" font-size="16" text-anchor="start" fill="#26313b">Jt 是不重复的整数源位置，范围 0…t；不是概率或主 head 轴。</text><text x="43" y="1010" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="1010" font-size="16" text-anchor="start" fill="#26313b">同一 query 的全部主 heads 共用 Jt，主概率 ph,sel 仍各自计算。</text><text x="43" y="1044" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="1044" font-size="16" text-anchor="start" fill="#26313b">Csel[a,:]=C[Jt[a],:]；KR 也按同一个 Jt gather，索引分数不替代主分数。</text><text x="410.0" y="1099" font-size="13" text-anchor="middle" fill="#7a8288">dsa-gather@五道口纳什</text></g></svg>