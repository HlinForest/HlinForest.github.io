<svg xmlns="http://www.w3.org/2000/svg" width="931.6799999999995" height="642" viewBox="0 0 931.6799999999995 642" role="img"><title>teacher p = mean_heads(Pmain) ; loss = KL(stopgrad(p) || softmax(I))</title><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="465.83999999999975" y="37" font-size="22" text-anchor="middle" fill="#26313b">teacher p = mean_heads(Pmain) ; loss = KL(stopgrad(p) || softmax(I))</text><text x="465.83999999999975" y="92" font-size="17" text-anchor="middle" fill="#64707b">同一 query 下，跨主 heads 汇总每个历史位置的概率</text><rect x="225.83999999999975" y="123.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="252.83999999999975" y="123.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="279.83999999999975" y="123.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="306.83999999999975" y="123.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="225.83999999999975" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="252.83999999999975" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="279.83999999999975" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="306.83999999999975" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="225.83999999999975" y="177.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="252.83999999999975" y="177.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="279.83999999999975" y="177.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="306.83999999999975" y="177.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><path d="M 220.83999999999975 122.0 h -4 v 81 h 4 M 336.83999999999975 122.0 h 4 v 81 h -4" fill="none" stroke="#626970"/><text x="278.83999999999975" y="230" font-size="18" text-anchor="middle" fill="#26313b">Pmain（逐头行）</text><text x="278.83999999999975" y="255" font-size="15" text-anchor="middle" fill="#64707b">Hq × L</text><text x="465.83999999999975" y="169.5" font-size="22" text-anchor="middle" fill="#26313b">mean heads →</text><rect x="599.8399999999997" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="626.8399999999997" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="653.8399999999997" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="680.8399999999997" y="150.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><path d="M 594.8399999999997 149.0 h -4 v 27 h 4 M 710.8399999999997 149.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="652.8399999999997" y="230" font-size="18" text-anchor="middle" fill="#26313b">teacher p</text><text x="652.8399999999997" y="255" font-size="15" text-anchor="middle" fill="#64707b">1 × L</text><text x="465.83999999999975" y="306" font-size="17" text-anchor="middle" fill="#64707b">索引分数在同一个监督集合上归一化</text><rect x="245.33999999999975" y="337.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="272.33999999999975" y="337.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="299.33999999999975" y="337.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="326.33999999999975" y="337.0" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><path d="M 240.33999999999975 336.0 h -4 v 27 h 4 M 356.33999999999975 336.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="298.33999999999975" y="390" font-size="18" text-anchor="middle" fill="#26313b">index scores I</text><text x="298.33999999999975" y="415" font-size="15" text-anchor="middle" fill="#64707b">1 × L</text><text x="465.83999999999975" y="356.5" font-size="22" text-anchor="middle" fill="#26313b">softmax →</text><rect x="580.3399999999997" y="337.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><rect x="607.3399999999997" y="337.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.9" stroke="#d7dadd" stroke-width=".5"/><rect x="634.3399999999997" y="337.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.68" stroke="#d7dadd" stroke-width=".5"/><rect x="661.3399999999997" y="337.0" width="25" height="25" rx="1.5" fill="#4F8FA5" fill-opacity="0.45" stroke="#d7dadd" stroke-width=".5"/><path d="M 575.3399999999997 336.0 h -4 v 27 h 4 M 691.3399999999997 336.0 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="633.3399999999997" y="390" font-size="18" text-anchor="middle" fill="#26313b">student π</text><text x="633.3399999999997" y="415" font-size="15" text-anchor="middle" fill="#64707b">1 × L</text><rect x="24" y="466" width="883.6799999999995" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="494" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="494" font-size="16" text-anchor="start" fill="#26313b">L 是监督位置数：warmup 为全部可见 token，稀疏阶段为所选 token。</text><text x="43" y="528" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="528" font-size="16" text-anchor="start" fill="#26313b">teacher 是概率，stopgrad 后固定；索引器输入同样不向主网反传。</text><text x="43" y="562" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="562" font-size="16" text-anchor="start" fill="#26313b">KL=Σs p_s(log p_s−log π_s)；主模型用 LM loss，索引器用此 KL。</text><text x="465.83999999999975" y="617" font-size="13" text-anchor="middle" fill="#7a8288">dsa-teacher@五道口纳什</text></g></svg>