.5" y="167.0" font-size="13" text-anchor="middle" fill="#26313b">6</text><path d="M 379.0 122.0 h -4 v 54 h 4 M 441.0 122.0 h 4 v 54 h -4" fill="none" stroke="#626970"/><text x="410.0" y="203" font-size="18" text-anchor="middle" fill="#26313b">V</text><text x="410.0" y="228" font-size="15" text-anchor="middle" fill="#64707b">2 × 2</text><text x="533.0" y="156.0" font-size="22" text-anchor="middle" fill="#26313b">=</text><rect x="630.0" y="136.5" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="642.5" y="153.5" font-size="13" text-anchor="middle" fill="#26313b">4</text><rect x="657.0" y="136.5" width="25" height="25" rx="1.5" fill="#C95B5B" fill-opacity="0.65" stroke="#d7dadd" stroke-width=".5"/><text x="669.5" y="153.5" font-size="13" text-anchor="middle" fill="#26313b">5</text><path d="M 625.0 135.5 h -4 v 27 h 4 M 687.0 135.5 h 4 v 27 h -4" fill="none" stroke="#626970"/><text x="656.0" y="203" font-size="18" text-anchor="middle" fill="#26313b">o</text><text x="656.0" y="228" font-size="15" text-anchor="middle" fill="#64707b">1 × 2</text><rect x="24" y="279" width="772" height="122" rx="3" fill="#f3f5f6"/><text x="43" y="307" font-size="16" text-anchor="start" fill="#26313b">维度</text><text x="101" y="307" font-size="16" text-anchor="start" fill="#26313b">2 个 key，2 个 value 通道；输入和输出都使用行向量。</text><text x="43" y="341" font-size="16" text-anchor="start" fill="#26313b">对象</text><text x="101" y="341" font-size="16" text-anchor="start" fill="#26313b">第一行 V 贡献 [0.25,0.5]，第二行贡献 [3.75,4.5]。</text><text x="43" y="375" font-size="16" text-anchor="start" fill="#26313b">机制</text><text x="101" y="375" font-size="16" text-anchor="start" fill="#26313b">每个输出坐标单独求和：0.25×1+0.75×5=4。</text><text x="410.0" y="430" font-size="13" text-anchor="middle" fill="#7a8288">weighted-example@五道口纳什</text></g></svg>